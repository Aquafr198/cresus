[workspace]
resolver = "2"
members = [
    "crates/cresus-server",
    "crates/cresus-api",
    "crates/cresus-core",
    "crates/cresus-db",
    "crates/cresus-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
