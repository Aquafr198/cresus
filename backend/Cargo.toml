[workspace]
resolver = "2"
members = [
    "crates/cresus-server",
    "crates/cresus-api",
    "crates/cresus-core",
    "crates/cresus-db",
    "crates/cresus-crypto",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
base64 = "0.21"
bincode = "1.3"
dotenv = "0.15"
