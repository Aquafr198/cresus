[package]
name = "offivex-server"
version.workspace = true
edition.workspace = true

[[bin]]
name = "offivex"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio.workspace = true
tower = "0.5"
# Audit MAX — added compression-gzip (PERF-MAX-2), request-id (OPS-MAX-2),
# normalize-path (defensive — strip trailing slash to avoid 404 surprises).
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "request-id", "normalize-path"] }
# Audit SEC-MAX-1 — constant-time comparison primitives.
subtle = "2"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
dotenvy = "0.15"
anyhow = "1"
tokio-rusqlite = "0.5"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = { workspace = true }
solana-sdk = "=2.1.15"
dashmap = "6"

offivex-api = { path = "../offivex-api" }
offivex-core = { path = "../offivex-core" }
offivex-db = { path = "../offivex-db" }
offivex-crypto = { path = "../offivex-crypto" }

[dev-dependencies]
tempfile = "3"
