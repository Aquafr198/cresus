# Shared Caddy snippets — imported by both `docker/Caddyfile` (docker-compose
# deployment) and the root `Caddyfile` (manual single-host deployment).
# Defining headers in one place avoids the dev/prod drift we audited.

(security_headers) {
	header {
		# Force HTTPS for 2 years, opt in to preload list.
		Strict-Transport-Security "max-age=63072000; includeSubDomains; preload"
		X-Content-Type-Options "nosniff"
		X-Frame-Options "DENY"
		Referrer-Policy "strict-origin-when-cross-origin"
		# X-XSS-Protection is legacy + deprecated — modern browsers ignore
		# it and CSP below covers it. Kept off intentionally.

		# Content-Security-Policy — restricts where the page can pull
		# resources / connect. Tuned for Next.js + SWR + WebSocket monitor:
		#   - script 'unsafe-eval' / 'unsafe-inline': Next.js runtime needs
		#     them. We could narrow with nonces once we add a CSP middleware.
		#   - img-src: blob: + data: for canvas-generated PNG previews +
		#     `_next/image` AVIF/WebP base64; https: covers IPFS gateways.
		#   - connect-src ws: wss: for /ws/monitor; https: for backend REST
		#     + any future analytics.
		#   - frame-ancestors 'none': anti-clickjacking — page cannot be
		#     iframed by any other site.
		Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' ws: wss: https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

		# Strip the `Server: Caddy/x.y.z` header so version fingerprinting
		# is one step harder.
		-Server
	}
}
