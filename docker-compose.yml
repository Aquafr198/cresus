# Docker Compose v2 — `version:` key is obsolete and is intentionally
# omitted (Compose warns if present).

services:
  # ── Backend (Rust / Axum) ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: offivex-backend
    restart: unless-stopped
    volumes:
      - backend-data:/app/data
    environment:
      - OFFIVEX_HOST=0.0.0.0
      - OFFIVEX_PORT=3001
      - OFFIVEX_DB_PATH=/app/data/offivex.db
      - OFFIVEX_LOG_LEVEL=${OFFIVEX_LOG_LEVEL:-info}
      - OFFIVEX_SOLANA_CLUSTER=${OFFIVEX_SOLANA_CLUSTER:-devnet}
      - SOLANA_RPC_MAINNET=${SOLANA_RPC_MAINNET:-https://api.mainnet-beta.solana.com}
      - SOLANA_RPC_DEVNET=${SOLANA_RPC_DEVNET:-https://api.devnet.solana.com}
      - PINATA_API_KEY=${PINATA_API_KEY:-}
      - PINATA_SECRET_KEY=${PINATA_SECRET_KEY:-}
      - BIRDEYE_API_KEY=${BIRDEYE_API_KEY:-}
      - JITO_BLOCK_ENGINE_URL=${JITO_BLOCK_ENGINE_URL:-https://mainnet.block-engine.jito.wtf}
      - JITO_TIP_LAMPORTS=${JITO_TIP_LAMPORTS:-10000}
      # Audit DEPLOY-2 — backend reads `OFFIVEX_CORS_ORIGINS` (not the legacy
      # `CORS_ALLOWED_ORIGINS` which was a name mismatch that silently let the
      # backend fall back to localhost-only defaults).
      # If OFFIVEX_CORS_ORIGINS is set in .env we honor it; otherwise we
      # synthesize https+http for the domain so devnet boot works.
      - OFFIVEX_CORS_ORIGINS=${OFFIVEX_CORS_ORIGINS:-https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}}
      # Audit DEPLOY-1 — REQUIRED. Backend panics at boot if empty/invalid
      # (see main.rs treasury_seed validation). Set this in .env via a secrets
      # manager — do NOT commit a real BIP39 phrase.
      - OFFIVEX_TREASURY_SEED_PHRASE=${OFFIVEX_TREASURY_SEED_PHRASE}
      - DEV_MODE=${DEV_MODE:-false}
      - OFFIVEX_PRIORITY_FEE_MICRO_LAMPORTS=${OFFIVEX_PRIORITY_FEE_MICRO_LAMPORTS:-50000}
    networks:
      - offivex-net
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Frontend (Next.js) ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: offivex-frontend
    restart: unless-stopped
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=3001
    networks:
      - offivex-net
    depends_on:
      backend:
        condition: service_healthy

  # ── Reverse Proxy (Caddy — auto TLS) ───────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: offivex-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    networks:
      - offivex-net
    depends_on:
      - frontend
      - backend

volumes:
  backend-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  offivex-net:
    driver: bridge
